# Overrides appended to Kafka's shipped config/server.properties.
#
# Kafka reads a properties file top-to-bottom into a map, so a key repeated
# later WINS. That is why we append this block instead of hand-editing the
# stock file -- upgrades stay easy (re-append onto the new stock file).
#
# Target: single node, broker + controller in one process (KRaft), everything
# (listener, Kafka, pgwriter, Postgres) on the same machine.

############################# Storage #############################

# Message data. Point this at your largest / fastest filesystem. Kafka will
# happily fill this disk until retention kicks in -- see the capacity note in
# INSTALL_KAFKA_UBUNTU.md before choosing.
log.dirs=/var/lib/kafka/data

############################# Networking #############################

# Bind to loopback only: every client (listener, pgwriter) is on this host, so
# Kafka must not be reachable from the network. PLAINTEXT with no auth on a
# routable interface would be an open door -- anyone could read or delete GPS
# data. If you later move a client to another box, change these to the private
# IP AND put SASL/TLS in front of it.
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093

# What the broker tells clients to connect back on. Mismatching this with
# `listeners` is the classic "connects, then times out" bug.
advertised.listeners=PLAINTEXT://127.0.0.1:9092

controller.listener.names=CONTROLLER
controller.quorum.bootstrap.servers=127.0.0.1:9093

############################# Single-node replication #############################

# With one broker there is only one copy of anything. RF>1 on the internal
# topics would leave the cluster unable to start them.
#
# Be honest about what this costs: RF=1 means a lost disk on this box is lost
# GPS data for anything Kafka accepted but pgwriter had not yet written to
# Postgres. That is the accepted trade for a single-server deployment.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
default.replication.factor=1
min.insync.replicas=1

############################# Topics #############################

# Matches deploy/create-topics.sh (gps.raw / gps.telemetry are 12 partitions).
num.partitions=12

# Do NOT let a typo'd topic name in a producer silently create a new topic.
# We create topics explicitly with deploy/create-topics.sh.
auto.create.topics.enable=false

# Deleting a topic should actually delete it.
delete.topic.enable=true

############################# Retention #############################

# Cluster-wide default. Per-topic retention set by deploy/create-topics.sh
# overrides this (gps.raw 7d, gps.telemetry 3d, gps.dlq 30d).
log.retention.hours=168

# Roll/expire in 512MB segments; retention can only delete whole closed
# segments, so huge segments delay reclaim.
log.segment.bytes=536870912
log.retention.check.interval.ms=300000
